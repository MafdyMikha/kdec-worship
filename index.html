<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KDEC Worship Platform</title>
    <meta name="description" content="Worship team planning and scheduling platform for Kasr El Doubara Evangelical Church" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved/system theme before styles and React render to prevent a light flash.
      (() => {
        try {
          const saved = localStorage.getItem('kdec_theme')
          const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {
          document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
